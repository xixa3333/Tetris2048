name: Build iOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag, for example v2.4.1"
        required: true
        default: "v2.4.1"
      app_version:
        description: "App version, for example 2.4.1"
        required: true
        default: "2.4.1"
      upload_release:
        description: "Upload the IPA to the GitHub Release"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      upload_testflight:
        description: "Upload the IPA to TestFlight"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-ios:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Solar2D
        run: |
          set -euo pipefail
          if [ ! -x "/Applications/Corona/Native/Corona/mac/bin/CoronaBuilder" ]; then
            brew install --cask solar2d
          fi
          test -x "/Applications/Corona/Native/Corona/mac/bin/CoronaBuilder"

      - name: Import Apple signing files
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$IOS_CERTIFICATE_BASE64"
          test -n "$IOS_CERTIFICATE_PASSWORD"
          test -n "$IOS_PROVISION_PROFILE_BASE64"
          test -n "$KEYCHAIN_PASSWORD"

          CERTIFICATE_PATH="$RUNNER_TEMP/ios_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_PATH=$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" >> "$GITHUB_ENV"

      - name: Build IPA with Solar2D
        env:
          APP_VERSION: ${{ inputs.app_version }}
          IOS_APP_NAME: BlockMerge2048
        run: |
          set -euo pipefail
          bash scripts/ci/build-ios.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockMerge2048-iOS-${{ inputs.app_version }}
          path: build/ios/*
          if-no-files-found: error

      - name: Upload IPA to GitHub Release
        if: ${{ inputs.upload_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/ios -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          gh release upload "${{ inputs.release_tag }}" "$IPA_PATH" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload IPA to TestFlight
        if: ${{ inputs.upload_testflight == 'true' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_BASE64"

          IPA_PATH="$(find build/ios -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
