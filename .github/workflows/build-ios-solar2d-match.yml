name: Build iOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag, for example v2.4.1"
        required: true
        default: "v2.4.1"
      app_version:
        description: "App version, for example 2.4.1"
        required: true
        default: "2.4.1"
      upload_release:
        description: "Upload the IPA to the GitHub Release"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      upload_testflight:
        description: "Upload the IPA to TestFlight"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      bootstrap_signing:
        description: "Create signing certificate/profile on the first run only"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-ios:
    runs-on: macos-14
    permissions:
      contents: write

    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      MATCH_GIT_BRANCH: ${{ vars.MATCH_GIT_BRANCH }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IOS_BUNDLE_ID"
          test -n "$MATCH_GIT_URL"
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_BASE64"
          test -n "$MATCH_PASSWORD"
          test -n "$MATCH_GIT_BASIC_AUTHORIZATION"

      - name: Install Solar2D
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "/Applications/Corona/Native/Corona/mac/bin/CoronaBuilder" ]; then
            brew install --cask solar2d
          fi
          test -x "/Applications/Corona/Native/Corona/mac/bin/CoronaBuilder"

      - name: Install fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane gem
        shell: bash
        run: gem install fastlane --no-document

      - name: Prepare App Store Connect API key
        id: asc_key
        shell: bash
        run: |
          set -euo pipefail
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          test -s "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Sync Apple signing with fastlane match
        shell: bash
        env:
          MATCH_READONLY: ${{ inputs.bootstrap_signing == 'true' && 'false' || 'true' }}
        run: |
          set -euo pipefail

          FASTLANE_DIR="$RUNNER_TEMP/fastlane"
          mkdir -p "$FASTLANE_DIR"

          cat > "$FASTLANE_DIR/Fastfile" <<'RUBY'
          default_platform(:ios)

          platform :ios do
            lane :sync_signing do
              setup_ci

              api_key = app_store_connect_api_key(
                key_id: ENV.fetch("APP_STORE_CONNECT_API_KEY_ID"),
                issuer_id: ENV.fetch("APP_STORE_CONNECT_API_ISSUER_ID"),
                key_filepath: ENV.fetch("ASC_KEY_PATH"),
                in_house: false
              )

              match(
                type: "appstore",
                app_identifier: ENV.fetch("IOS_BUNDLE_ID"),
                git_url: ENV.fetch("MATCH_GIT_URL"),
                git_basic_authorization: ENV.fetch("MATCH_GIT_BASIC_AUTHORIZATION"),
                git_branch: ENV["MATCH_GIT_BRANCH"].to_s.empty? ? "main" : ENV["MATCH_GIT_BRANCH"],
                readonly: ENV.fetch("MATCH_READONLY", "true") == "true",
                api_key: api_key
              )
            end
          end
          RUBY

          (cd "$FASTLANE_DIR" && fastlane ios sync_signing)

      - name: Locate Solar2D provisioning profile
        shell: bash
        run: |
          set -euo pipefail

          PROFILE_PATH=""
          SEARCH_DIRS=(
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            "$HOME/Library/MobileDevice/Provisioning Profiles"
          )

          while IFS= read -r -d '' candidate; do
            profile_plist="$RUNNER_TEMP/profile.plist"
            if ! security cms -D -i "$candidate" > "$profile_plist" 2>/dev/null; then
              continue
            fi

            application_identifier=$(
              /usr/libexec/PlistBuddy \
                -c 'Print :Entitlements:application-identifier' \
                "$profile_plist" 2>/dev/null || true
            )

            if [[ "$application_identifier" == *."$IOS_BUNDLE_ID" ]]; then
              PROFILE_PATH="$candidate"
              break
            fi
          done < <(
            for directory in "${SEARCH_DIRS[@]}"; do
              if [[ -d "$directory" ]]; then
                find "$directory" -type f -name '*.mobileprovision' -print0
              fi
            done
          )

          if [[ -z "$PROFILE_PATH" ]]; then
            echo "No App Store provisioning profile matching $IOS_BUNDLE_ID was found." >&2
            find "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                 "$HOME/Library/MobileDevice/Provisioning Profiles" \
                 -type f -name '*.mobileprovision' -print 2>/dev/null || true
            exit 1
          fi

          echo "Using provisioning profile: $PROFILE_PATH"
          echo "IOS_PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Verify signing identity
        shell: bash
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -Eq 'Apple Distribution|iPhone Distribution'
          test -f "$IOS_PROFILE_PATH"

      - name: Build IPA with Solar2D
        env:
          APP_VERSION: ${{ inputs.app_version }}
          IOS_APP_NAME: BlockMerge2048
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/build-ios.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockMerge2048-iOS-${{ inputs.app_version }}
          path: build/ios/*
          if-no-files-found: error

      - name: Upload IPA to GitHub Release
        if: ${{ inputs.upload_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/ios -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          gh release upload "${{ inputs.release_tag }}" "$IPA_PATH" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload IPA to TestFlight
        if: ${{ inputs.upload_testflight == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/ios -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
